[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
debug = false
codegen-units = 4

# Tests run on the real map; unoptimised geometry code would be far too slow.
[profile.dev]
opt-level = 3
debug = false

[profile.test]
opt-level = 3
debug = false
